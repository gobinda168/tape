<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tape camera</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1e20; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; opacity: 0; transition: opacity 240ms cubic-bezier(0.16, 1, 0.3, 1); }
  video.on { opacity: 1; }
  p { position: absolute; inset: 0; margin: 0; display: grid; place-items: center; padding: 18%; text-align: center; color: #a9abaf; font: 500 12px/1.35 system-ui, sans-serif; }
</style>
</head>
<body>
<video autoplay muted playsinline></video>
<p hidden></p>
<script src="camera.js"></script>
</body>
</html>
